<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>内核测试 (Chromium WebEngine)</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: "PingFang HK", "Microsoft YaHei", sans-serif; }
  /* ⭐ transform-origin 居中：缩放/镜像/旋转都以画面中心为基准，和 GStreamer 端 QML Scale/Rotation 一致。
     object-fit:fill = GStreamer 端 VideoOutput.Stretch（拉伸铺满容器、不留黑边），二者口径对齐。
     宽高默认铺满容器；旋转 90/270 时由 applyTransform 把宽高对调（等价 GStreamer 的宽高互换），
     position:absolute + 居中定位，便于旋转后仍居中铺满。 */
  /* ⭐ 呈现层抗顿：默认用 inset:0 + margin:auto 居中铺满，常态【零 transform / 零 transition】，
     让 Qt WebEngine 的 <video> 走硬件 overlay 直通(zero-copy)呈现，不被提升为逐帧 GPU 合成层。
     （旧写法 transform:translate(-50%,-50%) + transition 会把 video 常驻合成层 → 丢直通 → PRESENT GAP。）
     只有用户真正缩放/旋转/镜像/偏移时，applyTransform 才临时加 transform（那时卡一下可接受）。 */
  #remoteVideo { position: absolute; inset: 0; margin: auto; display: block; width: 100%; height: 100%; object-fit: fill; background: #000; transform-origin: center center; }
  /* SRT 不支持提示（网页内核无法播 SRT） */
  #srtBox {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    z-index: 99998; color: #ffb74d; font-size: 16px; text-align: center;
    background: rgba(0,0,0,0.8); padding: 18px 26px; border-radius: 8px; display: none; max-width: 80%;
  }
  #statsPanel {
    position: absolute; left: 10px; top: 10px; z-index: 9999;
    background: rgba(0,0,0,0.62); color: #00e676; padding: 8px 12px;
    border-radius: 6px; font-family: Consolas, monospace; font-size: 13px; line-height: 1.55;
    white-space: pre; pointer-events: none; min-width: 250px;
    /* ⭐ 默认隐藏统计信息，点右上角「信息」按钮才显示（2026-07-15：恢复点击展开，不再靠 hover 直接显示） */
    display: none;
  }
  #statsPanel .k { color: #80d8ff; }
  #statsPanel .warn { color: #ff5252; }
  #badge {
    position: absolute; right: 74px; top: 10px; z-index: 9999;
    background: rgba(33,150,243,0.85); color: #fff; padding: 4px 10px;
    border-radius: 4px; font-size: 12px; font-weight: bold; pointer-events: none;
    /* ⭐ badge 也默认隐藏，跟随统计开关一起显示（避免右上角常驻一个标识）；
       右移到开关按钮左侧（right:74px），开启时与开关并排不重叠。 */
    display: none;
  }
  /* ⭐ 统计信息开关按钮（右上角）。
     ⭐ 2026-07-15：改为「鼠标进入画面才显示这个按钮，点击按钮才显示统计面板」——
     不能像统计面板一样直接靠 hover 显示太多信息挡视线，按钮本身是"入口"，点了才展开详细信息。
     display 由 JS 的 setStatsHoverFromQml() 控制（QML 侧转发 hover 状态，见下方脚本注释）。 */
  #statsToggle {
    position: absolute; right: 10px; top: 10px; z-index: 10000;
    background: rgba(0,0,0,0.45); color: #cfd8dc; padding: 4px 10px;
    border-radius: 4px; font-size: 12px; cursor: pointer; user-select: none;
    border: 1px solid rgba(255,255,255,0.18); transition: background 0.15s;
    display: none;
  }
  #statsToggle:hover { background: rgba(0,0,0,0.7); }
  #statsToggle.on { background: rgba(33,150,243,0.85); color: #fff; border-color: transparent; }
  #errBox {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    z-index: 99999; color: #ff5252; font-size: 15px; text-align: center;
    background: rgba(0,0,0,0.8); padding: 16px 22px; border-radius: 8px; display: none; max-width: 80%;
  }
</style>
</head>
<body>
  <video id="remoteVideo" autoplay muted playsinline></video>
  <div id="statsToggle" title="显示/隐藏统计信息">信息</div>
  <div id="badge">Chromium 内核</div>
  <div id="statsPanel">等待启动…</div>
  <div id="errBox"></div>
  <div id="srtBox">⚠ 网页内核不支持 SRT 播放<br/>请在登录页切换到 GStreamer 内核</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  "use strict";

  const videoEl  = document.getElementById('remoteVideo');
  const statsEl  = document.getElementById('statsPanel');
  const badgeEl  = document.getElementById('badge');
  const errEl    = document.getElementById('errBox');
  const srtEl    = document.getElementById('srtBox');
  const toggleEl = document.getElementById('statsToggle');

  // ⭐ 2026-07-15：两步显示——① 鼠标进入实时流画面 → 只显示右上角「信息」开关按钮（入口）；
  //   ② 点击该按钮 → 才展开详细统计面板 + Chromium 徽标。避免鼠标一放上去统计信息就铺一堆挡视线。
  //   按钮本身的显隐由 QML 侧下发（不能靠页面自己监听 document 的 mousemove/mouseenter——
  //   MainPage.qml 里盖在整个实时流面板上的 livePanelHover（z 最高，负责驱动底部控制栏 + 这个按钮的
  //   hover 效果）会把鼠标移动(hover)事件拦在 WebEngineView 之上，页面收不到真实 mousemove；
  //   QML 端 livePanelHover 本来就能可靠拿到 hover 状态，直接转发过来最省事）。
  //   统计面板/徽标的展开与收起则是纯点击开关，与鼠标是否还在画面内无关（点开就一直显示，再点一次关掉）。
  let statsToggleHover = false  // 鼠标是否在实时流画面内（决定「信息」按钮是否显示）
  let statsOn = false           // 用户是否点开了统计面板（决定详细信息+徽标是否显示）

  function applyStatsToggleVisibility() {
    if (toggleEl) toggleEl.style.display = statsToggleHover ? 'block' : 'none'
  }
  function applyStatsPanelVisibility() {
    statsEl.style.display = statsOn ? 'block' : 'none'
    badgeEl.style.display = statsOn ? 'block' : 'none'
    if (toggleEl) { if (statsOn) toggleEl.classList.add('on'); else toggleEl.classList.remove('on') }
  }
  applyStatsToggleVisibility()
  applyStatsPanelVisibility()

  // QML → JS：livePanel.isHovering 变化时直接调用，true=鼠标在实时流面板内，false=移出
  window.setStatsHoverFromQml = function(visible) {
    statsToggleHover = !!visible
    applyStatsToggleVisibility()
  }

  if (toggleEl) {
    toggleEl.addEventListener('click', function() {
      statsOn = !statsOn
      applyStatsPanelVisibility()
    })
  }

  // ⭐ 本地画面变换（缩放/镜像/旋转），由 QML 在网页内核作主播放器时调用。
  //   与 GStreamer 端 VideoOutput 完全对齐：
  //   - GStreamer：90/270 时把 VideoOutput 的 width/height 对调成容器的 height/width，
  //     fillMode=Stretch 铺满该框，再 Rotation 居中旋转 → 旋转后正好铺满容器。
  //   - 这里照搬：90/270 把 #remoteVideo 的像素宽高对调（= 容器 height×width），object-fit:fill
  //     铺满，再 rotate 居中旋转 → 旋转后铺满，且不留黑边（与 Stretch 一致）。
  //   - zoom 1.0~5.0、mirror、offsetX/Y 与 GStreamer 端 Scale/偏移语义一致。
  //   CSS transform 顺序：translate(-50%,-50%) 先把绝对定位元素居中（对齐 origin），
  //     再 translate(offset) → rotate → scale（与 QML transform 列表 [Rotation, Scale] + 偏移等效）。
  window.applyTransform = function(zoom, mirror, rotation, offsetX, offsetY) {
    var z  = (typeof zoom === 'number' && zoom > 0) ? zoom : 1.0;
    var ox = (typeof offsetX === 'number') ? offsetX : 0;
    var oy = (typeof offsetY === 'number') ? offsetY : 0;
    var sx = (mirror === 'horizontal') ? -z : z;
    var sy = (mirror === 'vertical')   ? -z : z;
    var rot = ((rotation || 0) % 360 + 360) % 360;

    // 记录本次参数，供窗口 resize 时重算（保持铺满）。
    window._lastTransform = { zoom: z, mirror: mirror, rotation: rotation, offsetX: ox, offsetY: oy };

    // ⭐ 呈现层抗顿关键：常态（无缩放/旋转/镜像/偏移）时【完全不设 transform】，
    //   让 <video> 保持硬件 overlay 直通、不被提升为逐帧 GPU 合成层（消 PRESENT GAP）。
    //   CSS 已用 inset:0 + margin:auto 居中铺满，所以 transform 不再需要 translate(-50%,-50%) 来居中。
    var isIdentity = (z === 1.0 && rot === 0 && ox === 0 && oy === 0 && sx === 1 && sy === 1);

    // 容器尺寸 = webview 视口（KernelTestView 铺满 videoContainer，故等于容器大小）。
    var cw = window.innerWidth || document.documentElement.clientWidth || 0;
    var ch = window.innerHeight || document.documentElement.clientHeight || 0;

    if (isIdentity) {
      // 常态：清空 transform，走硬件直通。宽高恢复 100% 铺满（不显式钉像素，交给 object-fit:fill）。
      videoEl.style.width = '100%';
      videoEl.style.height = '100%';
      videoEl.style.transform = 'none';
      return;
    }

    // 需要变换：临时加 transform（用户缩放/旋转/镜像/偏移时，短暂走合成层可接受）。
    var swapped = (rot === 90 || rot === 270);
    if (!cw || !ch) {
      // 尺寸还没就绪（极早调用）：百分比兜底铺满。
      videoEl.style.width = '100%';
      videoEl.style.height = '100%';
    } else {
      // 90/270 对调宽高（等价 GStreamer 的 VideoOutput 宽高互换），其余铺满容器。
      videoEl.style.width  = (swapped ? ch : cw) + 'px';
      videoEl.style.height = (swapped ? cw : ch) + 'px';
    }
    // CSS 已居中(inset:0+margin:auto)，transform 只需 偏移→旋转→缩放（以元素中心为原点）。
    videoEl.style.transform =
      'translate(' + ox + 'px,' + oy + 'px) rotate(' + rot + 'deg) scale(' + sx + ',' + sy + ')';
  };

  // ⭐ Android 本地滤镜（网页内核 sink）：iOS 走设备端滤镜，Android 不支持 → PC 端本地处理。
  //   网页内核用 CSS filter 落地（Chromium 合成器 GPU 处理，不占 JS 主线程、不占 Qt 主线程，
  //   规避「主线程逐帧 canvas 编码卡死」那类坑）。参数为 CSS 乘数：1.0=中性。
  //   中性时清空 filter，让 <video> 回到硬件 overlay 直通（消 PRESENT GAP）。
  window.applyColorFilter = function(brightness, contrast, saturate) {
    var b = (typeof brightness === 'number' && brightness > 0) ? brightness : 1.0;
    var c = (typeof contrast   === 'number' && contrast   > 0) ? contrast   : 1.0;
    var s = (typeof saturate   === 'number' && saturate  >= 0) ? saturate   : 1.0;
    var isNeutral = (Math.abs(b - 1) < 1e-3 && Math.abs(c - 1) < 1e-3 && Math.abs(s - 1) < 1e-3);
    videoEl.style.filter = isNeutral
      ? 'none'
      : ('brightness(' + b + ') contrast(' + c + ') saturate(' + s + ')');
  };

  // 容器尺寸变化（窗口拖动/全屏切换）时，重算当前变换以保持铺满。
  window.addEventListener('resize', function() {
    if (window._lastTransform) {
      var t = window._lastTransform;
      window.applyTransform(t.zoom, t.mirror, t.rotation, t.offsetX, t.offsetY);
    }
  });

  // ⭐ 滚轮缩放：网页内核作主播放器时 webview 会吃掉滚轮事件（QML 的 videoZoomArea.onWheel 收不到）。
  //   这里在页面里监听 wheel，把方向+鼠标坐标转发给 C++（kernelBridge），由 QML 复用 GStreamer
  //   同款「聚焦缩放 + 偏移约束 + 跨 PC 推送」逻辑改 videoZoom → 再经 applyTransform 回写本页面。
  //   这样网页内核与 GStreamer 的滚轮缩放行为完全一致。
  window.addEventListener('wheel', function(e) {
    e.preventDefault();   // 避免页面滚动
    if (bridge && bridge.notifyWheelZoom) {
      try { bridge.notifyWheelZoom(e.deltaY, e.clientX, e.clientY); } catch(_){}
    }
  }, { passive: false });

  // ⭐ SRT 不支持提示（网页内核无法播 SRT）。show=true 时显示提示并清空画面。
  window.showSrtUnsupported = function(show) {
    if (show) {
      try { if (window.stopPlay) window.stopPlay(); } catch(_){}
      srtEl.style.display = 'block';
    } else {
      srtEl.style.display = 'none';
    }
  };

  let pc = null;
  let mode = '';            // 'srs' | 'p2p'
  let cfg = null;
  let bridge = null;        // QWebChannel: kernelBridge（P2P 信令）
  let statsTimer = null;
  let lastBytes = 0, lastTs = 0, lastFrames = 0, lastFrameTs = 0;
  let lastDecoded = 0, stallSeconds = 0;
  let reconnectTimer = null, reconnecting = false;
  let iceDisconnectTimer = null;   // ⭐ ICE 'disconnected' 宽限期定时器：disconnected 常能自愈，给几秒再决定是否重连

  // ⭐ 截图/慢放帧源：把解码后的 VideoFrame 连续编码成 JPEG 回传 C++（WebFrameSource 落盘）。
  //   与 GStreamer 端「逐帧 H.264 落盘」对等——截图要取事件帧前 N 帧，故必须持续落帧，
  //   不能只在按下时编。
  //   ⭐⭐ 治本（2026-06-26）：drawImage+convertToBlob(JPEG)+base64 这一串「重活」从主线程
  //   迁到 Worker——主线程只跑 MediaStreamTrackProcessor 读帧（轻），把 VideoFrame 用
  //   Transferable 直接转移给 Worker 编码，编完回传 base64，主线程仅做一次 bridge 调用。
  //   这样网络再好、编码再重也不再顶住 <video> 合成线程（消「顿住/freezeCount」主因）。
  //   Worker 用内联 Blob 构建（无需额外 qrc 文件）；不支持时自动退回主线程 encodeAndPush。
  let frameReader = null;       // ReadableStreamDefaultReader<VideoFrame>
  let frameAbort = false;       // 停止帧抓取标志
  let capCanvas = null;         // OffscreenCanvas（主线程兜底路径用）
  let capCtx = null;
  let capWorker = null;         // ⭐ 编码 Worker（VideoFrame→JPEG→base64，离开主线程）
  let capWorkerOk = false;      // Worker 是否可用（false=退回主线程编码）
  let lastCapTs = 0;            // 上次落帧时间戳（节流）
  let captureEnabled = true;    // ⭐ A/B 开关：关掉可验证"顿住"是否由抓帧引起（window.setCaptureEnabled(false)）
  let capBusy = false;          // ⭐ 上一帧是否仍在编码（防编码堆叠/无界排队）
  const CAP_MAX_FPS = 15;       // 落帧上限（慢放够用，控编码 CPU）
  const CAP_JPEG_QUALITY = 0.85;
  // ⭐ 排障/调优开关：网络好却顿住时，先 setCaptureEnabled(false) 看 freeze 是否归零。
  window.setCaptureEnabled = function(on){ captureEnabled = !!on; logC('截图/慢放抓帧 ' + (captureEnabled?'开':'关')); };
  // ⭐ 与竞品 webrtc-preview 对齐：帧宽 > CAP_MAX_WIDTH 才按宽等比缩到该值，≤ 则保留原始分辨率。
  //   （竞品 frameProcessor.worker：c=Math.min(1,1920/displayWidth)，仅 c<1 时 resize。
  //    所以 1080p=1920宽 不缩，仅 >1920(如4K) 缩到 1920。）
  const CAP_MAX_WIDTH = 1920;

  let offerHandled = false;    // 是否已成功应答过 Offer（去重 iOS 连发的多个 Offer）
  let negotiating = false;     // 应答是否进行中（防并发 createAnswer 撞 signalingState）
  let peerStopped = false;     // 对端(iOS)主动挂断/退出 → 绝不重连
  let everConnected = false;   // 是否曾经连上过（区分"网络抖动"vs"从没连上"）
  let reconnectAttempts = 0;   // 连续重连次数（从没连上时有限次后放弃）
  const MAX_RECONNECT_BEFORE_CONNECTED = 3;

  function showErr(msg) { errEl.style.display = 'block'; errEl.textContent = msg; logC('ERR ' + msg); }
  function hideErr() { errEl.style.display = 'none'; }
  // ⭐ 清理残留画面（2026-07-23）：Chromium 下 srcObject=null 只是断开媒体源，
  //   <video> 会把最后一帧一直留在画面上（设备退出/崩溃后画面看着像"还在"）。
  //   必须再调 load() 重置媒体元素才真正清屏。停播/挂断/断线重连统一走这里。
  function clearVideoFrame(why) {
    try {
      if (videoEl.srcObject) {
        try { videoEl.srcObject.getTracks().forEach(t => t.stop()); } catch(_){}
        videoEl.srcObject = null;
      }
      videoEl.load();   // 重置元素，清掉残留的最后一帧
      if (why) logC('已清理残留画面: ' + why);
    } catch(_){}
  }
  function logC(m) { try { if (bridge) bridge.log(m); } catch(_){} console.log('[webplayer]', m); }
  // [stutter-diag] webview-kernel realtime-stream + stall log -> exe-dir nh.txt (separate file for offline root-cause)
  function nhLog(m) { try { if (bridge && bridge.kernelStat) bridge.kernelStat(m); } catch(_){} }
  var nhLastFreeze = 0;       // [stutter-diag] previous freezeCount, for per-second delta
  var nhLastPresentTs = 0;    // [stutter-diag] last presented-frame ts (rVFC) for gap detection
  var nhLastMediaTime = -1;   // [stutter-diag] 上一帧的 mediaTime（媒体时间戳，秒）——区分"帧本身节奏"vs"呈现节奏"
  var nhLastPresentedFrames = 0; // [stutter-diag] 上次 rVFC 的 presentedFrames，用于算 gap 期间跳过的帧数
  var nhStallActive = false;  // [stutter-diag] whether a stall is currently being reported
  var nhLastRes = '';         // [stutter-diag] last WxH, to log resolution changes (SRS 切档/转码切流会强制解码器重配置 → 每次可能记一次 freeze)
  // [stutter-diag] auto A/B: 每 AB_PERIOD_MS 自动在「抓帧开/关」间切换，往 nh.txt 打分段标记，
  //   这样一份日志里天然含开/关两种状态的对照，无需手动开控制台。默认关，window.setAbDiag(true) 或 URL hash #abdiag 开启。
  var nhAbDiag = false;
  var nhAbPhaseTs = 0;
  var AB_PERIOD_MS = 20000;   // 每 20s 切一次
  window.setAbDiag = function(on){
    nhAbDiag = !!on;
    nhAbPhaseTs = (typeof performance !== 'undefined') ? performance.now() : Date.now();
    if (nhAbDiag) { captureEnabled = true; nhLog('>> AB DIAG on (auto toggle capture every ' + (AB_PERIOD_MS/1000) + 's)'); nhLog('>> AB PHASE capture=ON'); }
    else { captureEnabled = true; nhLog('>> AB DIAG off (capture restored ON)'); }
    logC('自动A/B诊断 ' + (nhAbDiag ? '开' : '关'));
  };
  try { if (location.hash && location.hash.indexOf('abdiag') >= 0) window.setAbDiag(true); } catch(_){}
  // [stutter-diag] main-thread long tasks freeze the compositor (#1 suspect for unexplained stutter). Log each >=50ms.
  (function installLongTaskObserver(){
    try {
      if (typeof PerformanceObserver === 'undefined') return;
      var obs = new PerformanceObserver(function(list){
        var es = list.getEntries();
        for (var i=0;i<es.length;i++){
          var e = es[i];
          if (e.duration >= 50) nhLog('LONGTASK dur=' + Math.round(e.duration) + 'ms name=' + e.name + ' start=' + Math.round(e.startTime));
        }
      });
      obs.observe({ entryTypes: ['longtask'] });
    } catch(_){}
  })();

  // ============ QWebChannel 初始化（P2P 信令桥）============
  //   qt.webChannelTransport 由 WebEngine 在 webChannel 设好后注入，可能比页面 JS 稍晚；
  //   且 qwebchannel.js 必须先加载（QWebChannel 才有定义）。这里：
  //   1) 页面一加载就预连（preInitChannel），不等 startPlay，给足初始化时间；
  //   2) 轮询等待最多 ~6s，每步把诊断打到屏幕（不用翻日志就知道卡在哪）；
  //   3) 连上后缓存 bridge，startPlay 直接用。
  let channelReady = false;     // QWebChannel 是否已建立（不论是否拿到 bridge）
  let channelInitStarted = false;

  function chanDiag(s) {
    // 仅在 P2P 未出画面时，把桥状态显示到屏幕，便于排障
    if (mode === 'p2p' && !channelReady) statsEl.textContent = s;
    logC(s);
  }

  function initChannel(cb) {
    // 已经连好：直接回调
    if (channelReady) { if (cb) cb(); return; }

    let tries = 0;
    const MAX = 60;  // 60 × 100ms = 6s
    (function waitTransport() {
      const hasJsLib   = (typeof QWebChannel !== 'undefined');
      const hasTrans   = (typeof qt !== 'undefined' && qt.webChannelTransport);
      if (hasJsLib && hasTrans) {
        try {
          new QWebChannel(qt.webChannelTransport, function(channel) {
            channelReady = true;
            bridge = channel.objects.kernelBridge;
            if (bridge) {
              logC('QWebChannel 已连接 kernelBridge');
              if (bridge.signalReceived) bridge.signalReceived.connect(onP2PSignal);
            } else {
              chanDiag('QWebChannel 连上但 channel.objects 里无 kernelBridge\n（C++ 未 registerObject?）');
            }
            if (cb) cb();
          });
        } catch (e) {
          chanDiag('QWebChannel 构造异常: ' + (e.message || e));
          if (cb) cb();
        }
        return;
      }
      tries++;
      if (tries % 5 === 0 || tries === 1) {
        chanDiag('等待 QWebChannel 就绪…(' + tries + '/' + MAX + ')\n' +
                 'qwebchannel.js=' + (hasJsLib ? 'OK' : '未加载') +
                 '  transport=' + (hasTrans ? 'OK' : '未注入'));
      }
      if (tries > MAX) {
        let why = !hasJsLib
          ? 'qwebchannel.js 未加载（qrc:///qtwebchannel/qwebchannel.js 取不到）'
          : 'qt.webChannelTransport 未注入（WebChannel 未绑定到 view / registeredObjects 为空）';
        chanDiag('QWebChannel 初始化超时\n原因: ' + why);
        if (cb) cb();
        return;
      }
      setTimeout(waitTransport, 100);
    })();
  }

  // 页面一加载就预连（与 startPlay 解耦，争取更早就绪）
  function preInitChannel() {
    if (channelInitStarted) return;
    channelInitStarted = true;
    initChannel(null);
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') preInitChannel();
  else document.addEventListener('DOMContentLoaded', preInitChannel);

  // ============ 对外入口 ============
  // SRS: window.startPlay({mode:'srs', host, app, stream, vhost})
  // P2P: window.startPlay({mode:'p2p'})   —— 参数从 bridge 拿
  window.startPlay = function(params) {
    cfg = params || {};
    mode = cfg.mode || 'srs';
    peerStopped = false; everConnected = false; reconnectAttempts = 0;
    badgeEl.textContent = 'Chromium 内核 · ' + mode.toUpperCase();
    initChannel(function() {
      if (mode === 'p2p') startP2P();
      else startSRS();
    });
  };

  window.stopPlay = async function() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (iceDisconnectTimer) { clearTimeout(iceDisconnectTimer); iceDisconnectTimer = null; }
    reconnecting = false;
    if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
    // ⭐ 停播即上报 fps=0，QML 拉流心跳随之停发 → iOS 3s 后判定「PC 未连接」。
    if (bridge && bridge.notifyViewerFps) { try { bridge.notifyViewerFps(0); } catch(_){} }
    // ⭐ 停止截图/慢放帧抓取（QML kernelStop 会调 resetCaptureFrames 清盘）。
    stopFrameCapture();
    if (mode === 'p2p' && bridge && cfg && cfg._iosDev) {
      try { bridge.sendSignal('WEBRTC_HANGUP', cfg._iosDev, '', '', '', '', 0); } catch(_){}
      try { bridge.notifyTestStopped(); } catch(_){}
    }
    if (pc) { try { pc.close(); } catch(_){} pc = null; }
    clearVideoFrame('stopPlay');
  };

  // ============ 公共：track 处理 + 双缓冲防卡顿 ============
  function attachTrack(stream, receiver) {
    videoEl.srcObject = stream;
    // ⭐ 抗"画面顿住"关键：SRS/WHEP 链路下内核默认把 jitterBufferTarget 压到极低（实测 jbDelay≈43ms），
    //   抗抖动能力太差——帧到齐了(零丢包)但到达时间稍有抖动就赶不上下一个 VSync → PRESENT GAP（肉眼顿住）。
    //   nh.txt 已证明：cap=off(抓帧关) + loss=0% + 无 LONGTASK 时仍有 PRESENT GAP，纯呈现层抖动，唯一对症解=加大抖动缓冲。
    //   （D:\zhen 是 P2P 直连、抖动小，故它不设也不卡；SRS/WHEP 经服务器转发+GOP cache，抖动更大，必须设。）
    //   设 200ms：吸收到达抖动、平滑呈现，代价是端到端延迟 +~160ms，对监控/画质对比场景完全可接受。
    try {
      // 🔥 2026-07-02 收回诊断值（原 2.0s 是为坐实"发送端突发到达"的实验值，已坐实并回推流端修根）：
      //   - P2P 直连：完全不设，交给 Chromium 自适应 jitter buffer（对标竞品 D:\zhen 零干预，
      //     实测 netJitter≈30ms，自适应几十 ms 起步足够，白设只会加延迟）。
      //   - SRS/WHEP：设 300ms（服务器转发+GOP cache 抖动更大，需固定缓冲；发送端攒帧修复后
      //     无需 2000ms 削峰，300ms 为延迟/流畅折中，与 §15.2 结论一致）。
      if (mode === 'p2p') {
        logC('P2P 直连：不设 jitterBufferTarget（用 Chromium 自适应，低延迟）');
      } else {
        const JB_TARGET_SEC = 0.3;
        // 优先用 ontrack 传入的 receiver（最可靠）；兜底遍历 pc.getReceivers。
        let vrecvs = [];
        if (receiver && receiver.track && receiver.track.kind === 'video') vrecvs = [receiver];
        else if (pc && pc.getReceivers) vrecvs = pc.getReceivers().filter(r => r.track && r.track.kind === 'video');
        vrecvs.forEach(r => {
          try { r.jitterBufferTarget = JB_TARGET_SEC * 1000; } catch(_){}          // 新标准：毫秒
          try { r.playoutDelayHint = JB_TARGET_SEC; } catch(_){}                    // 老属性：秒（Chromium 兼容）
        });
        logC('jitterBufferTarget 设为 ' + (JB_TARGET_SEC*1000) + 'ms（SRS 抗呈现抖动），命中 receiver=' + vrecvs.length);
      }
    } catch(e) { logC('设 jitterBufferTarget 失败（用内核默认）: ' + e); }

    // ⭐ 启动截图/慢放帧抓取（把解码帧连续编 JPEG 回传 C++）。
    startFrameCapture(stream);
    // [stutter-diag] measure actual *presented* frame intervals via requestVideoFrameCallback.
    //   A long gap = visible stutter even when decode stats look fine. Logs gaps >= 120ms to nh.txt.
    try {
      if (videoEl.requestVideoFrameCallback) {
        nhLastPresentTs = 0; nhLastMediaTime = -1; nhLastPresentedFrames = 0;
        var nhRvfc = function(now, meta){
          // ⭐ [pacing-diag] 关键诊断：区分"帧本身节奏"vs"呈现节奏"，定位顿到底在解码前还是呈现层。
          //   now       = 墙钟时间（该帧真正被呈现的时刻）→ 相邻差 = 呈现间隔（呈现节奏）。
          //   mediaTime = 该帧的媒体时间戳（源帧时间，秒）→ 相邻差 = 帧的原始时间间隔（发送端/媒体节奏）。
          //   presentedFrames = 累计呈现帧数 → gap 期间增量>1 说明合成器一次吐了多帧（补帧/追帧）。
          //   判据：呈现间隔(wallGap)很大 但 媒体间隔(mediaGap)接近正常(≈50ms×跳帧数) → 帧是均匀的，顿在呈现层
          //         → 上 canvas+rAF 方案；若 mediaGap 本身就大且不匀 → 发送端 pacing/NACK 问题。
          var mt = (meta && typeof meta.mediaTime === 'number') ? meta.mediaTime : -1;
          var pf = (meta && meta.presentedFrames) ? meta.presentedFrames : 0;
          if (nhLastPresentTs > 0) {
            var gap = now - nhLastPresentTs;
            if (gap >= 120) {
              var mediaGap = (mt >= 0 && nhLastMediaTime >= 0) ? Math.round((mt - nhLastMediaTime) * 1000) : -1;
              var pfDelta = (pf && nhLastPresentedFrames) ? (pf - nhLastPresentedFrames) : -1;
              nhLog('>> PRESENT GAP ' + Math.round(gap) + 'ms (visible stutter) presentedFrames=' + pf
                  + ' mediaGap=' + mediaGap + 'ms pfDelta=' + pfDelta);
            }
          }
          nhLastPresentTs = now;
          nhLastMediaTime = mt;
          nhLastPresentedFrames = pf;
          if (videoEl.srcObject) videoEl.requestVideoFrameCallback(nhRvfc);
        };
        videoEl.requestVideoFrameCallback(nhRvfc);
      }
    } catch(_){}
  }

  // ============ 截图/慢放：连续抓帧编 JPEG 回传 C++ ============
  function startFrameCapture(stream) {
    stopFrameCapture();
    // 前置能力检查：需 MediaStreamTrackProcessor + OffscreenCanvas + kernelBridge。
    if (!bridge || !bridge.pushCaptureFrame) { logC('帧抓取跳过：无 kernelBridge.pushCaptureFrame'); return; }
    if (typeof MediaStreamTrackProcessor === 'undefined') { logC('帧抓取跳过：浏览器无 MediaStreamTrackProcessor'); return; }
    const vtrack = stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
    if (!vtrack) { logC('帧抓取跳过：无视频轨'); return; }

    frameAbort = false;
    lastCapTs = 0;
    ensureCaptureWorker();      // ⭐ 尝试建编码 Worker（失败则走主线程兜底）
    try {
      const processor = new MediaStreamTrackProcessor({ track: vtrack });
      frameReader = processor.readable.getReader();
    } catch(e) { logC('创建 MediaStreamTrackProcessor 失败: ' + e); return; }

    const minInterval = 1000 / CAP_MAX_FPS;

    (async function pump() {
      logC('帧抓取已启动（≤' + CAP_MAX_FPS + 'fps，编码在 ' + (capWorkerOk ? 'Worker' : '主线程兜底') + '）');
      while (!frameAbort && frameReader) {
        let result;
        try { result = await frameReader.read(); }
        catch(e) { logC('帧读取异常: ' + e); break; }
        if (result.done) break;
        const vf = result.value;   // VideoFrame
        const ts = (typeof performance !== 'undefined') ? performance.now() : Date.now();
        // ⭐ 防顿住关键：仅在 capture 开启、上一帧已编完(capBusy=false)、未超节流上限时才编码。
        if (captureEnabled && !capBusy && (ts - lastCapTs >= minInterval)) {
          lastCapTs = ts;
          capBusy = true;
          if (capWorkerOk && capWorker) {
            // ⭐ 把 VideoFrame Transferable 转移给 Worker —— 转移后主线程的 vf 即失效，无需再 close。
            try {
              capWorker.postMessage({ vf: vf, maxWidth: CAP_MAX_WIDTH, quality: CAP_JPEG_QUALITY }, [vf]);
            } catch(e) {
              // 转移失败（运行时不支持 VideoFrame transfer）：本帧退回主线程编码并禁用 Worker。
              capWorkerOk = false;
              encodeAndPush(vf).catch(()=>{}).finally(() => { try { vf.close(); } catch(_){} capBusy = false; });
            }
          } else {
            // 主线程兜底：编码不 await，后台跑，编完 close 并清 capBusy。
            encodeAndPush(vf).catch(()=>{}).finally(() => { try { vf.close(); } catch(_){} capBusy = false; });
          }
        } else {
          try { vf.close(); } catch(_){}
        }
      }
      logC('帧抓取已停止');
    })();
  }

  // ============ 编码 Worker（VideoFrame→JPEG→base64，离开主线程）============
  //   主线程只负责读帧 + 转移 VideoFrame；重活全在 Worker。Worker 回传 base64 后，
  //   主线程做唯一一次 bridge.pushCaptureFrame（QWebChannel 只能在主线程调）。
  function ensureCaptureWorker() {
    if (capWorker || capWorkerOk) return;
    // 前置能力：需 VideoFrame 可转移 + Worker + OffscreenCanvas + convertToBlob。
    if (typeof Worker === 'undefined' || typeof VideoFrame === 'undefined' || typeof OffscreenCanvas === 'undefined') {
      capWorkerOk = false; logC('编码 Worker 不可用 → 退回主线程编码'); return;
    }
    const workerSrc = [
      'let cv=null, cx=null;',
      'self.onmessage = async (e) => {',
      '  const d = e.data; const vf = d.vf;',
      '  try {',
      '    const sw = vf.displayWidth || vf.codedWidth, sh = vf.displayHeight || vf.codedHeight;',
      '    if (!sw || !sh) { try{vf.close();}catch(_){}; self.postMessage({ok:false}); return; }',
      '    const scale = Math.min(1, d.maxWidth / sw);',
      '    const w = scale < 1 ? Math.round(sw * scale) : sw;',
      '    const h = scale < 1 ? Math.round(sh * scale) : sh;',
      '    if (!cv || cv.width !== w || cv.height !== h) { cv = new OffscreenCanvas(w, h); cx = cv.getContext("2d", { alpha:false }); }',
      '    cx.drawImage(vf, 0, 0, w, h);',
      '    try { vf.close(); } catch(_){}',
      '    const blob = await cv.convertToBlob({ type:"image/jpeg", quality: d.quality });',
      '    const buf = await blob.arrayBuffer();',
      '    const bytes = new Uint8Array(buf);',
      '    let binary = ""; const chunk = 0x8000;',
      '    for (let i = 0; i < bytes.length; i += chunk) { binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk)); }',
      '    self.postMessage({ ok:true, b64: btoa(binary) });',
      '  } catch(err) { try{vf.close();}catch(_){}; self.postMessage({ ok:false, err: String(err) }); }',
      '};'
    ].join('\n');
    try {
      const url = URL.createObjectURL(new Blob([workerSrc], { type: 'application/javascript' }));
      capWorker = new Worker(url);
      URL.revokeObjectURL(url);
      capWorker.onmessage = (e) => {
        const d = e.data || {};
        if (d.ok && d.b64) { try { bridge.pushCaptureFrame(d.b64, -1); } catch(_){} }
        capBusy = false;   // ⭐ 一帧编码完成，放行下一帧
      };
      capWorker.onerror = (e) => {
        logC('编码 Worker 出错 → 退回主线程编码: ' + (e.message || e));
        capWorkerOk = false; capBusy = false;
        try { capWorker.terminate(); } catch(_){}
        capWorker = null;
      };
      capWorkerOk = true;
      logC('编码 Worker 已就绪（抓帧编码已离开主线程）');
    } catch(e) {
      capWorkerOk = false; capWorker = null;
      logC('创建编码 Worker 失败 → 退回主线程编码: ' + e);
    }
  }

  async function encodeAndPush(vf) {
    const sw = vf.displayWidth || vf.codedWidth;
    const sh = vf.displayHeight || vf.codedHeight;
    if (!sw || !sh) return;
    // ⭐ 与竞品对齐：宽 > CAP_MAX_WIDTH 才等比缩；否则原始分辨率（1080p 不缩）。
    const scale = Math.min(1, CAP_MAX_WIDTH / sw);
    const w = (scale < 1) ? Math.round(sw * scale) : sw;
    const h = (scale < 1) ? Math.round(sh * scale) : sh;
    if (!capCanvas || capCanvas.width !== w || capCanvas.height !== h) {
      capCanvas = new OffscreenCanvas(w, h);
      capCtx = capCanvas.getContext('2d', { alpha: false, desynchronized: true });
    }
    // drawImage 指定目标 w/h 完成缩放（高质量重采样由内核保证）。
    capCtx.drawImage(vf, 0, 0, w, h);
    // OffscreenCanvas → JPEG Blob → base64（去掉 data: 前缀）→ 回传 C++。
    const blob = await capCanvas.convertToBlob({ type: 'image/jpeg', quality: CAP_JPEG_QUALITY });
    const buf = await blob.arrayBuffer();
    const b64 = bytesToBase64(new Uint8Array(buf));
    try { bridge.pushCaptureFrame(b64, -1); } catch(e) { /* 落盘失败忽略 */ }
  }

  // Uint8Array → base64（分块避免 String.fromCharCode 爆栈）。
  function bytesToBase64(bytes) {
    let binary = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function stopFrameCapture() {
    frameAbort = true;
    if (frameReader) {
      try { frameReader.cancel(); } catch(_){}
      try { frameReader.releaseLock && frameReader.releaseLock(); } catch(_){}
      frameReader = null;
    }
    // ⭐ 关掉编码 Worker，释放 OffscreenCanvas/线程，避免重连后堆叠多个 Worker。
    if (capWorker) {
      try { capWorker.terminate(); } catch(_){}
      capWorker = null;
    }
    capWorkerOk = false;
    capBusy = false;
  }

  // ============ SRS WHEP ============
  async function startSRS() {
    try {
      hideErr();
      if (!cfg.host || !cfg.stream) { showErr('SRS 参数缺失 host/stream'); return; }
      cfg.app = cfg.app || 'tenantA'; cfg.vhost = cfg.vhost || 'vid-7gg4748';
      statsEl.textContent = '正在协商 SRS WHEP…';
      await rebuildPC();
      pc.addTransceiver('video', { direction: 'recvonly' });   // 本系统 SRS 纯视频无音频
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      // [H265] 第四十九章：H265 会话时 play API 追加 ?codec=hevc（SRS 6.0 RTC H265 协商开关），
      //   并诊断本内核 offer/能力里是否真带 H265（Chromium 需 WebRtcAllowH265Receive + 平台 HEVC 硬解）。
      const wantH265 = (cfg.codec === 'h265');
      try {
        var offerHasH265 = /H265|HEVC/i.test(offer.sdp);
        var rxCaps = (window.RTCRtpReceiver && RTCRtpReceiver.getCapabilities) ? RTCRtpReceiver.getCapabilities('video') : null;
        var kernelH265 = !!(rxCaps && rxCaps.codecs && rxCaps.codecs.some(function(c){ return /H265|HEVC/i.test(c.mimeType||''); }));
        logC('SRS offer 编码诊断: wantH265=' + wantH265 + ' offerHasH265=' + offerHasH265 + ' kernelSupportsH265=' + kernelH265);
        nhLog('>> SRS H265 CHECK want=' + wantH265 + ' offerHasH265=' + offerHasH265 + ' kernelSupportsH265=' + kernelH265);
        if (wantH265 && !offerHasH265) {
          // Qt 6.10.3 的 WebEngine = Chromium 134，Qt 发行版编译期未启用 WebRTC H265 接收
          //（getCapabilities 无 video/H265，且 Chromium H265 无软解），启动参数无法解锁。
          showErr('网页内核(Chromium 134)不支持 H265 接收（Qt 发行版编译期限制）\n' +
                  'H265 请使用 GStreamer 内核观看（已支持硬解），或将设备端编码改为 H264');
        }
      } catch(_){}
      const apiUrl = 'http://' + cfg.host + ':1985/rtc/v1/play/' + (wantH265 ? '?codec=hevc' : '');
      const streamUrl = 'webrtc://' + cfg.host + '/' + cfg.app + '/' + cfg.stream + '?vhost=' + cfg.vhost + '&eip=' + cfg.host;
      const sdpCRLF = offer.sdp.replace(/\r\n/g,'\n').replace(/\n/g,'\r\n');
      const resp = await fetch(apiUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({api:apiUrl, streamurl:streamUrl, sdp:sdpCRLF}) });
      const data = await resp.json();
      if (data.code && data.code !== 0) { showErr('SRS 错误 code=' + data.code); return; }
      await pc.setRemoteDescription({ type:'answer', sdp:data.sdp });
      logC('SRS setRemoteDescription OK');
      startStats();
    } catch (e) { showErr('SRS 异常: ' + (e.message||e)); }
  }

  // 等 bridge 就绪（最多 6s），避免时序误报"未就绪"
  function waitBridge() {
    return new Promise(resolve => {
      if (bridge) { resolve(true); return; }
      initChannel(function() { resolve(!!bridge); });
    });
  }

  // ============ P2P（PC 是 Answerer，信令走 kernelBridge）============
  async function startP2P() {
    try {
      hideErr();
      if (!bridge) {
        chanDiag('P2P：等待 QWebChannel 桥就绪…');
        await waitBridge();
      }
      if (!bridge) {
        showErr('P2P 需要 kernelBridge（QWebChannel 未就绪）\n' +
                '检查：CMake 是否链接 Qt6::WebChannel；main.cpp 是否 registerObject("kernelBridge")；KernelTestView 的 webChannel/registeredObjects 是否绑定');
        return;
      }
      const iosDev = bridge.getPairedDeviceId ? await call0(bridge.getPairedDeviceId) : '';
      cfg._iosDev = iosDev;
      if (!iosDev) { showErr('P2P: 配对 iOS 设备 id 为空'); return; }
      statsEl.textContent = '正在建立 P2P…\niOS=' + iosDev;

      // 通知 C++ 断开 GStreamer P2P，让出 username 会话
      try { bridge.notifyTestStarted(); } catch(_){}

      await rebuildPC();

      // 发 WEBRTC_REQUEST，等 iOS 回 Offer
      logC('发送 WEBRTC_REQUEST → ' + iosDev);
      bridge.sendSignal('WEBRTC_REQUEST', iosDev, '', '', '', '', 0);
      startStats();
    } catch (e) { showErr('P2P 异常: ' + (e.message||e)); }
  }

  // QWebChannel 的 Q_INVOKABLE 返回值是异步回调形式
  function call0(fn) { return new Promise(res => { fn(function(r){ res(r); }); }); }

  async function onP2PSignal(jsonStr) {
    if (mode !== 'p2p' || !pc) return;
    let msg; try { msg = JSON.parse(jsonStr); } catch(e){ return; }
    const type = msg.type;
    if (type === 'WEBRTC_SDP' && msg.sdpType === 'offer') {
      // ⭐ iOS 会在极短时间内连发多个内容相同的 Offer（实测 3ms 内 3 个）。
      //   onP2PSignal 是 async，多个 Offer 会并发跑：第一个走完 setLocalDescription 后
      //   signalingState 变成 stable，后到的 createAnswer 就会报
      //   「cannot create an answer in a state other than have-remote-offer」。
      //   recvonly 单向拉流，第一个 Offer 已足够 → 用 offerHandled 去重，重复 Offer 直接忽略。
      if (offerHandled) { logC('忽略重复 Offer（已应答）'); return; }
      if (negotiating)  { logC('忽略并发 Offer（应答进行中）'); return; }
      negotiating = true;
      try {
        logC('收到 iOS Offer');
        // [H265] 能力/协商诊断：Offer 里是否带 H265、本内核能否收 H265（Chromium 需 WebRtcAllowH265Receive
        //   + 平台 HEVC 硬解；不满足时 Answer 自动只留 H264，iOS 侧回落 H264 推流，不黑屏只降级）。
        try {
          var offerHasH265 = /H265|HEVC/i.test(msg.sdp);
          var rxCaps = (window.RTCRtpReceiver && RTCRtpReceiver.getCapabilities) ? RTCRtpReceiver.getCapabilities('video') : null;
          var kernelH265 = !!(rxCaps && rxCaps.codecs && rxCaps.codecs.some(function(c){ return /H265|HEVC/i.test(c.mimeType||''); }));
          nhLog('>> H265 CHECK offerHasH265=' + offerHasH265 + ' kernelSupportsH265=' + kernelH265
              + (offerHasH265 && !kernelH265 ? ' (将回落H264: 内核不支持H265接收)' : ''));
        } catch(_){}
        await pc.setRemoteDescription({ type:'offer', sdp: msg.sdp });
        // 二次校验：setRemoteDescription 后状态必须是 have-remote-offer 才能 createAnswer
        if (pc.signalingState !== 'have-remote-offer') {
          logC('状态非 have-remote-offer（=' + pc.signalingState + '），跳过本次应答');
          negotiating = false;
          return;
        }
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        bridge.sendSignal('WEBRTC_SDP', cfg._iosDev, 'answer', answer.sdp, '', '', 0);
        offerHandled = true;
        logC('已回 Answer');
      } catch(e) { showErr('处理 Offer 失败: ' + (e.message||e)); }
      negotiating = false;
    } else if (type === 'WEBRTC_ICE') {
      try {
        if (msg.candidate) {
          await pc.addIceCandidate({ candidate: msg.candidate, sdpMid: msg.sdpMid || '0', sdpMLineIndex: msg.sdpMLineIndex || 0 });
        }
      } catch(e) { logC('addIceCandidate 失败: ' + e); }
    } else if (type === 'WEBRTC_HANGUP') {
      // ⭐ iOS 主动挂断/退出/停止推流（reason=ios_stop_publish 等）→ 绝不重连
      const reason = msg.reason || '';
      logC('iOS 挂断 reason=' + reason + ' → 停止，不重连');
      peerStopped = true;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      if (iceDisconnectTimer) { clearTimeout(iceDisconnectTimer); iceDisconnectTimer = null; }
      reconnecting = false;
      if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
      // ⭐ iOS 挂断也上报 fps=0 + 停帧抓取（与 stopPlay 口径一致）。
      if (bridge && bridge.notifyViewerFps) { try { bridge.notifyViewerFps(0); } catch(_){} }
      stopFrameCapture();
      if (pc) { try { pc.close(); } catch(_){} pc = null; }
      clearVideoFrame('对端挂断(' + reason + ')');
      statsEl.innerHTML = '<span class="warn">iOS 已退出/停止推流</span>\n（不再重连，关闭后重开测试）';
    }
  }

  async function rebuildPC() {
    if (pc) { try { pc.close(); } catch(_){} pc = null; }
    // 新 PeerConnection → 允许重新接收并应答 Offer
    offerHandled = false; negotiating = false;
    let iceServers = [];
    if (mode === 'p2p' && bridge && bridge.getIceServers) {
      try { const s = await call0(bridge.getIceServers); iceServers = JSON.parse(s || '[]'); } catch(_){}
    }
    pc = new RTCPeerConnection({ bundlePolicy:'max-bundle', iceServers: iceServers });
    pc.ontrack = (ev) => { if (ev.streams && ev.streams[0]) attachTrack(ev.streams[0], ev.receiver); };
    pc.onicecandidate = (ev) => {
      if (mode === 'p2p' && ev.candidate && bridge && cfg._iosDev) {
        bridge.sendSignal('WEBRTC_ICE', cfg._iosDev, '', '',
          ev.candidate.candidate, ev.candidate.sdpMid || '0', ev.candidate.sdpMLineIndex || 0);
      }
    };
    pc.oniceconnectionstatechange = () => {
      if (!pc) return;
      const st = pc.iceConnectionState;
      logC('ICE: ' + st);
      if (st === 'connected' || st === 'completed') {
        // ⭐ ICE 恢复：取消 disconnected 宽限期重连（说明只是短暂抖动/主线程卡顿导致的假断线）。
        if (iceDisconnectTimer) { clearTimeout(iceDisconnectTimer); iceDisconnectTimer = null; logC('ICE 已自愈，取消待定重连'); }
        // ⭐ 网页内核作主播放器时 GStreamer 已让出 P2P，原本由 GStreamer 的
        //   onFirstFrameReceived 发的 VIEWER_CONNECTED 不会触发 → iOS 收不到「PC 已连接」反馈。
        //   这里在内核 P2P 首次连上时补发同一信令（与 GStreamer 端口径完全一致），
        //   让 iOS 端照常显示「PC 端已连接」。只发一次，避免 connected/completed 反复触发重复发。
        if (mode === 'p2p' && bridge && cfg && cfg._iosDev && !everConnected) {
          try {
            bridge.sendSignal('VIEWER_CONNECTED', cfg._iosDev, '', '', '', '', 0);
            logC('已通知 iOS：VIEWER_CONNECTED（PC 端已连接）');
          } catch(e) { logC('发送 VIEWER_CONNECTED 失败: ' + e); }
        }
        everConnected = true;
        reconnectAttempts = 0;   // 连上了，重连计数清零
      }
      // ⭐ 'failed' = 永久失败，立即重连；'disconnected' = 常能自愈（尤其主线程长任务导致心跳延迟时），
      //   给 6s 宽限期，期间若回到 connected 则上面的分支会取消，避免"假断线→完全重建流→更长断流"。
      if (st === 'failed') {
        if (iceDisconnectTimer) { clearTimeout(iceDisconnectTimer); iceDisconnectTimer = null; }
        scheduleReconnect();
      } else if (st === 'disconnected') {
        if (!iceDisconnectTimer && !reconnecting && !peerStopped) {
          logC('ICE disconnected → 6s 宽限期观察是否自愈');
          iceDisconnectTimer = setTimeout(() => {
            iceDisconnectTimer = null;
            if (!pc) return;
            const cur = pc.iceConnectionState;
            if (cur === 'disconnected' || cur === 'failed') {
              logC('ICE 6s 未自愈（当前=' + cur + '）→ 触发重连');
              scheduleReconnect();
            }
          }, 6000);
        }
      }
    };
  }

  // ============ 自动重连（带退出/放弃判断，避免 iOS 退了还傻乎乎无限重连）============
  function scheduleReconnect() {
    // ⭐ 对端主动退出/挂断 → 绝不重连
    if (peerStopped) { logC('对端已退出，跳过重连'); return; }
    if (reconnecting || reconnectTimer) return;

    // ⭐ 从没连上过（iOS 不在线/没回 Offer）→ 有限次后放弃，不无限重连
    if (!everConnected) {
      reconnectAttempts++;
      if (reconnectAttempts > MAX_RECONNECT_BEFORE_CONNECTED) {
        logC('从未连上且已重试 ' + (reconnectAttempts-1) + ' 次 → 放弃（iOS 可能不在线/未推流）');
        statsEl.innerHTML = '<span class="warn">连接失败</span>\niOS 可能不在线或未推流\n（关闭后重开测试）';
        clearVideoFrame('重连放弃');
        return;
      }
    }

    reconnecting = true;
    // ⭐ 2026-07-23：走到这里=连接已确认死亡（ICE failed / disconnected 6s 未自愈 / 卡死 10s+）。
    //   立即清掉冻住的最后一帧——设备崩溃/被杀时收不到 HANGUP，只会走这条路，
    //   不清的话画面会一直残留"假活着"的旧帧（重连成功后 attachTrack 会重新挂新流）。
    clearVideoFrame('连接中断，进入重连');
    const tag = everConnected ? '网络中断' : ('iOS 未响应(第' + reconnectAttempts + '次)');
    nhLog('>> RECONNECT scheduled (' + tag + ') iceState=' + (pc ? pc.iceConnectionState : 'nopc') + ' stall=' + stallSeconds + 's');
    logC(tag + ' → 3 秒后自动重连');
    statsEl.textContent = tag + '，自动重连中…';
    reconnectTimer = setTimeout(async () => {
      reconnectTimer = null;
      if (peerStopped) { reconnecting = false; return; }
      try {
        if (mode === 'p2p') {
          await rebuildPC();
          bridge.sendSignal('WEBRTC_REQUEST', cfg._iosDev, '', '', '', '', 0);
          logC('重连：已重发 WEBRTC_REQUEST');
        } else {
          await startSRS();
        }
      } catch(e) { logC('重连失败: ' + e); }
      reconnecting = false;
    }, 3000);
  }

  // ⭐ 防马赛克快速恢复：花屏风险时立即（非 3s 延时）刷新关键帧。
  //   P2P：重发 WEBRTC_REQUEST → iOS 重新协商 → 吐新 IDR（iOS 无需改动）。
  //   SRS：重新 startSRS（重发 Offer）→ SRS 吐新关键帧。
  //   损坏的参考帧链路整段刷新后，马赛克消除。节流由调用处 ARTIFACT_MIN_INTERVAL 控制。
  var lastKfRecoveryTs = 0;   // 🔥 2026-07-02: 内部节流（stall 分级兜底改为 2s 起每秒进来，这里统一挡）
  async function scheduleKeyframeRecovery() {
    if (peerStopped) return;
    var nowTs = Date.now();
    if (nowTs - lastKfRecoveryTs < 3000) return;  // 最小 3s 间隔，防 WS request_keyframe 风暴
    lastKfRecoveryTs = nowTs;
    // ⭐ 2026 改：花屏恢复「只请求关键帧」，不再 rebuildPC / 重发 WEBRTC_REQUEST / 重建 Offer。
    //   旧实现重建整个 PeerConnection（P2P）或重发 Offer（SRS），每次都有 ICE/DTLS 重协商空窗，
    //   导致媒体断流、packetsLost 计数跳变 —— 弱网下越抖越重建、越重建越抖（自残）。
    //   新口径与竞品 / GStreamer 端 requestKeyframeWithFallback 一致：
    //     · 主路：Chromium 检测到丢包/花屏会自动发 RTCP PLI → iOS(P2P 直收) / SRS(转发) 自动补 IDR；
    //     · 兜底：经 kernelBridge 发 WebSocket request_keyframe，防 SRS 不回传 RTCP 时 iOS 收不到 PLI。
    //   节流由调用处 ARTIFACT_MIN_INTERVAL(4s) 控制。
    try {
      if (bridge && bridge.requestKeyframe) {
        bridge.requestKeyframe();
        logC('花屏恢复：已请求关键帧（WS request_keyframe，不重建PC）');
      } else {
        logC('花屏恢复：依赖自动 RTCP PLI（bridge.requestKeyframe 暂不可用，需重新构建 PC 端）');
      }
    } catch(e) { logC('请求关键帧失败: ' + e); }
  }

  // ============ 防马赛克：弱网花屏风险检测（搬竞品 webrtc-preview 策略）============
  // 竞品做法：PC 端监控「丢包增量 / 丢帧增量」超阈值 → 给设备发 requestKeyFrame 补 IDR 刷掉马赛克。
  // 本端按方案a（纯前端、先不碰 iOS）：检测到花屏风险 → 节流触发一次重连（SRS 重发 Offer / P2P 重发
  //   WEBRTC_REQUEST），强制服务器/设备吐出新关键帧，把已损坏的参考帧链路整段刷新 → 马赛克消除。
  var lastPktLost = 0;        // 上次累计丢包
  var lastFramesDropped = 0;  // 上次累计丢帧
  var lastKeyRecoverTs = 0;   // 上次触发恢复的时间戳（节流用）
  var artifactStreak = 0;     // 连续花屏风险计数
  const ARTIFACT_LOST_DELTA = 8;     // 单采样丢包增量阈值
  const ARTIFACT_DROP_DELTA = 5;     // 单采样丢帧增量阈值
  const ARTIFACT_MIN_INTERVAL = 4000; // 两次恢复最小间隔(ms)，避免抖动期狂重连

  // ============ 统计 + 卡顿检测 ============
  function startStats() {
    lastBytes=0; lastTs=0; lastFrames=0; lastFrameTs=0; lastDecoded=0; stallSeconds=0;
    lastPktLost=0; lastFramesDropped=0; artifactStreak=0;
    if (statsTimer) clearInterval(statsTimer);
    statsTimer = setInterval(async () => {
      if (!pc) return;
      try {
        const stats = await pc.getStats();
        let inbound = null, selPair = null;
        const codecById = {};   // [H265] codecId → mimeType（确认实际协商到的编码）
        stats.forEach(r => {
          if (r.type==='inbound-rtp' && r.kind==='video') inbound = r;
          if (r.type==='codec') codecById[r.id] = r.mimeType || '';
          // ⭐ 选中的候选对：判断真实走的是「直连(host/srflx/prflx)」还是「公网中继(relay)」
          if (r.type==='candidate-pair' && (r.nominated || r.selected)) selPair = r;
        });
        if (!inbound) { statsEl.textContent = '等待视频流…'; return; }
        // [H265] 实际生效编码变化时打一条（首次/切换各一条，供 nh 日志对齐卡顿分析）
        try {
          var curCodec = inbound.codecId ? (codecById[inbound.codecId] || '') : '';
          if (curCodec && curCodec !== window._nhLastCodec) {
            window._nhLastCodec = curCodec;
            nhLog('>> CODEC ' + curCodec + (/H265|HEVC/i.test(curCodec) ? ' (H265会话)' : ' (H264会话)'));
          }
        } catch(_){}
        // ⭐ 线路类型（relay = 绕公网 TURN，同局域网下应为直连）
        let routeTxt = '—';
        if (selPair) {
          const lc = stats.get(selPair.localCandidateId), rc = stats.get(selPair.remoteCandidateId);
          const lt = lc ? lc.candidateType : '?', rt = rc ? rc.candidateType : '?';
          const isRelay = (lt === 'relay' || rt === 'relay');
          routeTxt = '<span class="' + (isRelay ? 'warn' : 'k') + '">' + lt + '/' + rt + (isRelay ? '（中继!）' : '（直连）') + '</span>';
        }
        const now = inbound.timestamp;
        let kbps = (lastTs>0 && inbound.bytesReceived!=null) ? Math.round((inbound.bytesReceived-lastBytes)*8/(now-lastTs)) : 0;
        lastBytes = inbound.bytesReceived||0; lastTs = now;
        let fpsReal = (lastFrameTs>0 && inbound.framesDecoded!=null) ? Math.round((inbound.framesDecoded-lastFrames)*1000/(now-lastFrameTs)) : 0;
        lastFrames = inbound.framesDecoded||0; lastFrameTs = now;
        // ⭐ FPS x4 对齐 GStreamer：GStreamer 端显示的 receiveFps = m_fpsEma*4（gstplayer.cpp:2471），
        //   网页内核这里同样 x4，让两边 UI 的 FPS 数值口径一致（含右上角面板与拉流心跳上报）。
        const fps = fpsReal * 4;

        // ⭐ 上报帧率给 C++（内核作主播放器时，QML 据此发 VIEWER_HEARTBEAT，让 iOS 显示「PC 已连接」）。
        //   fps>0 即代表画面在播；P2P/SRS 都报，QML 侧只在内核模式采用。
        if (bridge && bridge.notifyViewerFps) { try { bridge.notifyViewerFps(fps); } catch(_){} }

        // 卡顿检测：解码帧数 1 秒没涨 = 画面卡住（双缓冲耗尽）
        const dec = inbound.framesDecoded||0;
        if (dec === lastDecoded) { stallSeconds++; } else { stallSeconds = 0; }
        lastDecoded = dec;

        const w = inbound.frameWidth||0, h = inbound.frameHeight||0;
        const lost = inbound.packetsLost||0, nack = inbound.nackCount||0, pli = inbound.pliCount||0;
        const jb = (inbound.jitterBufferDelay!=null && inbound.jitterBufferEmittedCount) ? Math.round(inbound.jitterBufferDelay/inbound.jitterBufferEmittedCount*1000) : 0;
        // ⭐ 网络原始抖动（RFC3550 jitter，inbound-rtp.jitter 单位秒→ms）：直接反映"网络包到达抖不抖"。
        //   若 netJitter 很小(<10ms)但仍 PRESENT GAP → 顿在呈现层(GPU/VSync)，非网络；若 netJitter 大 → 网络到达抖动。
        const netJitter = inbound.jitter!=null ? Math.round(inbound.jitter*1000) : -1;
        const freeze = inbound.freezeCount!=null ? inbound.freezeCount : '-';
        const stallTxt = stallSeconds>=2 ? ('<span class="warn">画面卡住 '+stallSeconds+'s</span>') : ('<span class="k">流畅</span>');

        // ⭐ 防马赛克：丢包/丢帧增量超阈值 = 花屏风险 → 节流触发重连刷新关键帧
        const dropped = inbound.framesDropped || 0;
        const lostDelta = Math.max(0, lost - lastPktLost);
        const dropDelta = Math.max(0, dropped - lastFramesDropped);
        lastPktLost = lost; lastFramesDropped = dropped;
        // ⭐ 真正反映链路质量的是「丢包率」（不是累计 packetsLost）：lost/(lost+received)。
        //   累计 lost 跑久了到几千很正常；丢包率 < 1~2% 即肉眼无感。lostDelta = 本秒新增丢包。
        const recv = inbound.packetsReceived || 0;
        const lossRate = (recv + lost) > 0 ? (lost / (recv + lost) * 100) : 0;
        const artifactRisk = (lostDelta >= ARTIFACT_LOST_DELTA) || (dropDelta >= ARTIFACT_DROP_DELTA);
        if (artifactRisk && dec !== lastDecoded /* 仍在出帧才算花屏(非纯卡死) */) {
          artifactStreak++;
          const nowMs = Date.now();
          if (nowMs - lastKeyRecoverTs >= ARTIFACT_MIN_INTERVAL) {
            lastKeyRecoverTs = nowMs;
            logC('⚠️ 花屏风险(丢包+'+lostDelta+'/丢帧+'+dropDelta+') → 请求关键帧(不重建PC)');
            scheduleKeyframeRecovery();
          }
        } else {
          artifactStreak = 0;
        }

        // ⭐ 抓帧编码路径：直观显示「重活」是在 Worker 还是退回了主线程（顿住排查用）。
        // [stutter-diag] per-second realtime-stream snapshot to nh.txt + dedicated stall/freeze events
        var nhFreezeNum = (typeof freeze === 'number') ? freeze : 0;
        var nhFreezeDelta = Math.max(0, nhFreezeNum - nhLastFreeze);
        nhLastFreeze = nhFreezeNum;
        // [stutter-diag] 分辨率变化单独打点：SRS 自适应/多档转码切流 或 发送端切档会强制解码器重配置，
        //   常伴随 freeze / PRESENT GAP。把「变化时刻 + 新旧分辨率」钉出来，便于和 freeze 时间对齐。
        var nhRes = w + 'x' + h;
        if (nhLastRes && nhLastRes !== nhRes) nhLog('>> RES CHANGE ' + nhLastRes + ' -> ' + nhRes + ' (decoder reconfig; watch freeze/gap)');
        nhLastRes = nhRes;
        // [stutter-diag] 自动 A/B：到期切换抓帧开关并打分段标记（一份日志含开/关对照，无需手动开控制台）。
        var nhAbTag = '-';
        if (nhAbDiag) {
          var nowAb = (typeof performance !== 'undefined') ? performance.now() : Date.now();
          if (nowAb - nhAbPhaseTs >= AB_PERIOD_MS) {
            nhAbPhaseTs = nowAb;
            captureEnabled = !captureEnabled;
            nhLog('>> AB PHASE capture=' + (captureEnabled ? 'ON' : 'OFF'));
          }
          nhAbTag = captureEnabled ? 'on' : 'off';
        }
        var nhCap = (!frameReader) ? 'none' : (!captureEnabled ? 'off' : (capWorkerOk ? 'worker' : 'main'));
        nhLog('STAT codec=' + (window._nhLastCodec || '?') + ' res=' + w + 'x' + h + ' fps=' + fps + ' kbps=' + kbps
            + ' loss=' + lossRate.toFixed(2) + '% lostDelta=' + lostDelta + ' dropDelta=' + dropDelta
            + ' nack=' + nack + ' pli=' + pli + ' jbDelay=' + jb + 'ms netJitter=' + netJitter + 'ms freeze=' + nhFreezeNum + '(+' + nhFreezeDelta + ')'
            + ' stall=' + stallSeconds + 's cap=' + nhCap + ' capBusy=' + capBusy + ' ab=' + nhAbTag);
        if (nhFreezeDelta > 0) nhLog('>> FREEZE +' + nhFreezeDelta + ' total=' + nhFreezeNum + ' res=' + w + 'x' + h + ' fps=' + fps + ' jbDelay=' + jb + 'ms cap=' + nhCap + ' loss=' + lossRate.toFixed(2) + '%');
        if (stallSeconds >= 2 && !nhStallActive) { nhStallActive = true; nhLog('>> STALL start (decode frozen) fps=' + fps + ' kbps=' + kbps + ' cap=' + nhCap + ' jbDelay=' + jb + 'ms'); }
        if (stallSeconds === 0 && nhStallActive) { nhStallActive = false; nhLog('>> STALL end'); }
        var capTxt;
        if (!frameReader) { capTxt = '<span class="warn">未启动</span>'; }
        else if (!captureEnabled) { capTxt = '关闭(A/B)'; }
        else if (capWorkerOk) { capTxt = '<span class="k">Worker（离主线程）</span>'; }
        else { capTxt = '<span class="warn">主线程兜底</span>'; }

        // ⭐ §57.3（补 §56.28b 的漏网：当时只改了 GStreamer 面板）：编码显示**故意**恒为 H265
        //   （障眼，不暴露真实会话编码）。真实协商编码仍在 nh 日志的 `>> CODEC` 行里，排障不受影响。
        var codecTxt = '<span class="warn">H265</span>';

        statsEl.innerHTML =
          '<span class="k">内核</span>: Chromium · ' + mode.toUpperCase() + ' · ' + codecTxt + '\n' +
          '<span class="k">分辨率</span>: ' + w + 'x' + h + '\n' +
          '<span class="k">解码FPS</span>: ' + fps + '\n' +
          '<span class="k">码率</span>: ' + kbps + ' kbps\n' +
          '<span class="' + (lossRate>=2?'warn':'k') + '">丢包率</span>: ' + lossRate.toFixed(2) + '%　(累计' + lost + ' / +' + lostDelta + '/s)\n' +
          '<span class="k">NACK</span>: ' + nack + '　<span class="k">PLI</span>: ' + pli + '\n' +
          '<span class="k">线路</span>: ' + routeTxt + '\n' +
          '<span class="k">抓帧编码</span>: ' + capTxt + '\n' +
          '<span class="k">抖动缓冲</span>: ' + jb + ' ms (内核自适应)\n' +
          '<span class="k">卡顿次数</span>: ' + freeze + '　状态: ' + stallTxt;

        // ⭐ 卡顿兜底分级（避免"主线程长任务→解码短暂停→误判断线→完全重建流→更长断流"的自残）：
        //   🔥 2026-07-02 提前：nh.txt 实测 STALL 期间码率照收、NACK 在涨=解码器在等 IDR，
        //      原来 5s 才要关键帧等于白白多卡 3 秒。改 ① 2s 起就请求关键帧（scheduleKeyframeRecovery
        //      自带 ≥4s 节流，不会风暴）；② ≥10s 关键帧救不回（大概率真断线/ICE 挂了）才完全重连。
        //   真断线由 connectionState==='failed'/'disconnected' 单独触发 scheduleReconnect（见 rebuildPC）。
        if (stallSeconds >= 10) {
          logC('画面卡住≥10s（关键帧未恢复）→ 触发重连');
          scheduleReconnect();
        } else if (stallSeconds >= 2) {
          logC('画面卡住≥2s → 先请求关键帧（不重建流）');
          scheduleKeyframeRecovery();
        }
      } catch(e) { statsEl.textContent = 'getStats 异常: ' + e; }
    }, 1000);
  }
</script>
